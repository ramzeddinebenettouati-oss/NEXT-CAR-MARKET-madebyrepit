openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AutoCango Vehicle Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management operations
  - name: vehicles
    description: Vehicle listing operations
  - name: seller
    description: Seller dashboard operations
  - name: reference
    description: Reference data
  - name: buyer
    description: Buyer portal operations (favorites, dashboard, notifications)
  - name: chat
    description: Chat and messaging operations
  - name: quotations
    description: Quotation management operations
  - name: orders
    description: Order lifecycle management operations
  - name: payments
    description: SWIFT payment submission and verification
  - name: storage
    description: Object storage upload and serving endpoints
  - name: freight
    description: Freight forwarder portal — freight requests, shipping quotes, forwarder chat
  - name: shipments
    description: Shipment lifecycle tracking and document management
  - name: admin
    description: Admin and Super Admin portal operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/phone/request-otp:
    post:
      operationId: requestPhoneOtp
      tags: [auth]
      summary: Request a 6-digit OTP via SMS for phone sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequestInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRequestResponse"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/phone/verify:
    post:
      operationId: verifyPhoneOtp
      tags: [auth]
      summary: Verify OTP and sign in or return a phoneToken for new users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerifyInput"
      responses:
        "200":
          description: OTP valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpVerifyResponse"
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/phone/complete:
    post:
      operationId: completePhoneProfile
      tags: [auth]
      summary: Complete registration for a new phone-verified user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpCompleteInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error or invalid phoneToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update current user's profile (name, country, language preference)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/user:
    get:
      tags: [auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user (session-based)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.

  /logout:
    get:
      tags: [auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [super_admin, admin, seller, buyer, freight_forwarder]
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}/suspend:
    post:
      operationId: suspendUser
      tags: [users]
      summary: Suspend or activate a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserInput"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /reference/countries:
    get:
      operationId: listCountries
      tags: [reference]
      summary: List all active countries
      responses:
        "200":
          description: Countries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"

  /reference/ports:
    get:
      operationId: listPorts
      tags: [reference]
      summary: List all active ports
      responses:
        "200":
          description: Ports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Port"

  /reference/currencies:
    get:
      operationId: listCurrencies
      tags: [reference]
      summary: List all active currencies
      responses:
        "200":
          description: Currencies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currency"

  /reference/brands:
    get:
      operationId: listVehicleBrands
      tags: [reference]
      summary: List vehicle brands
      responses:
        "200":
          description: Brands list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleBrand"

  /reference/models:
    get:
      operationId: listVehicleModels
      tags: [reference]
      summary: List vehicle models, optionally filtered by brand
      parameters:
        - name: brandId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleModel"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List/search published vehicle listings
      parameters:
        - name: brandId
          in: query
          schema:
            type: string
        - name: brandName
          in: query
          schema:
            type: string
        - name: modelName
          in: query
          schema:
            type: string
        - name: fuelType
          in: query
          schema:
            type: string
            enum: [petrol, diesel, electric, hybrid, phev, hydrogen, lpg, other]
        - name: condition
          in: query
          schema:
            type: string
            enum: [new, used, certified_used]
        - name: yearMin
          in: query
          schema:
            type: integer
        - name: yearMax
          in: query
          schema:
            type: integer
        - name: priceMin
          in: query
          schema:
            type: number
        - name: priceMax
          in: query
          schema:
            type: number
        - name: sellerId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, published, rejected, archived]
        - name: exteriorColor
          in: query
          description: Filter by exterior color (partial match)
          schema:
            type: string
        - name: evOnly
          in: query
          description: If true, show only electric/hybrid/PHEV vehicles
          schema:
            type: boolean
        - name: inStock
          in: query
          description: If true, only show listings with quantity > 0
          schema:
            type: boolean
        - name: originPortId
          in: query
          description: Filter by origin port UUID
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc, popular]
            default: newest
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Vehicle listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"

    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle listing (seller only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleInput"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /vehicles/{vehicleId}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get vehicle detail
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle listing (seller who owns it or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleInput"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"

    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle listing
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /vehicles/{vehicleId}/submit:
    post:
      operationId: submitVehicleForReview
      tags: [vehicles]
      summary: Submit a draft listing for admin review
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"

  /vehicles/images/request-upload:
    post:
      operationId: requestVehicleImageUpload
      tags: [vehicles]
      summary: Request a seller-scoped App Storage URL for a vehicle image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Unsupported image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /vehicles/{vehicleId}/images/attach:
    post:
      operationId: attachVehicleImage
      tags: [vehicles]
      summary: Attach an App Storage image to a vehicle listing
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachVehicleImageInput"
      responses:
        "201":
          description: Image attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleImage"

  /vehicles/{vehicleId}/images/{imageId}:
    delete:
      operationId: deleteVehicleImage
      tags: [vehicles]
      summary: Delete a vehicle image
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /vehicles/{vehicleId}/videos:
    post:
      operationId: addVehicleVideo
      tags: [vehicles]
      summary: Add a video to a vehicle listing (file upload or external URL)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                url:
                  type: string
                  description: External video URL (YouTube, Vimeo, etc.) if not uploading a file
                title:
                  type: string
      responses:
        "201":
          description: Video added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleVideo"

  /vehicles/{vehicleId}/videos/{videoId}:
    delete:
      operationId: deleteVehicleVideo
      tags: [vehicles]
      summary: Delete a vehicle video
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /seller/dashboard:
    get:
      operationId: getSellerDashboard
      tags: [seller]
      summary: Get seller dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerDashboard"

  /seller/listings:
    get:
      operationId: listSellerListings
      tags: [seller]
      summary: List seller's own vehicle listings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, published, rejected, archived]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Seller listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"

  # ── Favorites ──────────────────────────────────────────────────────────────

  /favorites:
    get:
      operationId: listFavorites
      tags: [buyer]
      summary: List the authenticated buyer's favorite vehicles
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Favorites list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesListResponse"

  /favorites/{vehicleId}:
    post:
      operationId: toggleFavorite
      tags: [buyer]
      summary: Toggle a vehicle in/out of favorites
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleFavoriteResponse"

  # ── Conversations ─────────────────────────────────────────────────────────

  /conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List conversations for the current user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Conversations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"

    post:
      operationId: createConversation
      tags: [chat]
      summary: Start a new conversation with a seller about a vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Conversation created or existing one returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [chat]
      summary: Get conversation detail with message history
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
